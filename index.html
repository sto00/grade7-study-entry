<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>7급 학습서재 접속</title><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:#eef1e9;color:#23342c;font:18px/1.7 system-ui,-apple-system,sans-serif}main{max-width:620px;margin:12vh auto;padding:28px}h1{font-size:28px;margin:0 0 20px}p{margin:12px 0}.small{font-size:14px;opacity:.8}button{font:inherit;cursor:pointer;border:1px solid #657e70;border-radius:10px;padding:10px 18px;background:#365d4b;color:white;margin:10px 8px 0 0}.quiet{background:transparent;color:inherit;font-size:14px}a{color:inherit}@media(prefers-color-scheme:dark){body{background:#1e2723;color:#dce4de}}
</style></head><body><main><h1>7급 학습서재</h1><p id="status" role="status">컴퓨터의 학습서재에 연결하고 있습니다.</p><p id="detail" class="small">이 주소를 북마크해 두세요. 서버 주소가 바뀌어도 자동으로 찾아갑니다.</p><button id="retry" type="button">다시 연결</button><button id="forget" class="quiet" type="button" hidden>이 브라우저의 자동 연결 해제</button><p class="small">학습 기록은 Mac mini에 저장됩니다.</p></main><script>
'use strict';
const statusNode=document.getElementById('status'),detail=document.getElementById('detail'),key='grade7-device-connection';
let token='',busy=false,nextFreshCheck=0,knownEndpoint=null;
try{token=localStorage.getItem(key)||'';}catch{}
const params=new URLSearchParams(location.hash.slice(1));
const supplied=params.get('device')||params.get('connect');
const validSupplied=Boolean(supplied&&/^[A-Za-z0-9_-]{43}$/.test(supplied));
const setup=validSupplied&&!params.has('connect')&&token!==supplied;
if(validSupplied){token=supplied;try{localStorage.setItem(key,token);}catch{}history.replaceState(null,'',location.pathname+location.search);}
if(setup){statusNode.textContent='자동 연결을 저장했습니다. 이 페이지를 북마크해 주세요.';detail.textContent='아이폰 Safari의 공유 버튼에서 책갈피에 추가한 뒤 학습을 시작하세요. 다음부터 북마크를 열면 자동으로 연결됩니다.';document.getElementById('retry').textContent='학습 시작';}
document.getElementById('forget').hidden=!token;
document.getElementById('forget').onclick=()=>{try{localStorage.removeItem(key);}catch{}token='';document.getElementById('forget').hidden=true;statusNode.textContent='자동 연결을 해제했습니다. 컴퓨터에 저장된 학습 기록은 그대로 유지됩니다.';};
const initialDelay=10000, maxDelay=300000;
let activated=!setup, retryDelay=initialDelay, retryTimer=0, navigating=false;
const available=()=>!document.hidden&&navigator.onLine!==false;
function cancelRetry(){clearTimeout(retryTimer);retryTimer=0;}
function scheduleRetry(){
 cancelRetry();
 if(!available()||!activated||navigating)return;
 retryTimer=setTimeout(()=>void connect(),retryDelay);
 retryDelay=Math.min(retryDelay*2,maxDelay);
}
async function endpoint(forceFresh){
 // A branch URL can remain cached after a restart. Ask the public Contents API
 // first, then keep the newest answer while limiting unauthenticated API use.
 // Only a confirmed offline result may suppress a metadata check.
 if(!forceFresh && knownEndpoint?.url==='' && Date.now()<nextFreshCheck)return knownEndpoint;
 if(forceFresh || Date.now()>=nextFreshCheck){
  nextFreshCheck=Date.now()+90000;
  try{
   const response=await fetch('https://api.github.com/repos/sto00/grade7-study-entry/contents/endpoint.json?ref=main&time='+Date.now(),{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-store',signal:AbortSignal.timeout(10000)});
   if(response.ok){knownEndpoint=await response.json();return knownEndpoint;}
  }catch{}
 }
 try{
  if(!available())throw new Error('접속 일시 중지');
  const response=await fetch('https://raw.githubusercontent.com/sto00/grade7-study-entry/main/endpoint.json?time='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(10000)});
  if(response.ok){const value=await response.json();if(!knownEndpoint||Date.parse(value.updatedAt)>Date.parse(knownEndpoint.updatedAt))knownEndpoint=value;}
 }catch{}
 if(!knownEndpoint)throw new Error('주소 확인 실패');
 return knownEndpoint;
}
async function connect(forceFresh=false){
 cancelRetry();
 if(!activated||busy||navigating||!available())return;
 busy=true;
 try{
  const info=await endpoint(forceFresh);
  if(!available())return;
  if(typeof info.url!=='string'||!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(info.url))throw new Error('서버 꺼짐');
  const check=await fetch(info.url+'/api/health',{credentials:'omit',cache:'no-store',signal:AbortSignal.timeout(12000)});
  if(!check.ok||(await check.json()).ready!==true)throw new Error('서버 미연결');
  if(!available())return;
  statusNode.textContent='연결되었습니다. 학습서재로 이동합니다.';
  location.replace(info.url+'/'+(token?'#reconnect='+encodeURIComponent(token):'#study'));
  navigating=true;
 }catch{
  if(available()){
   statusNode.textContent='학습서재에 연결할 수 없습니다.';
   detail.textContent='잠시 후 다시 연결합니다. 지금 확인하려면 다시 연결을 눌러 주세요.';
  }
 }finally{busy=false;scheduleRetry();}
}
function resume(){
 cancelRetry();
 if(!activated)return;
 if(navigator.onLine===false){
  statusNode.textContent='인터넷 연결을 기다리고 있습니다.';
  detail.textContent='인터넷에 연결되면 학습서재를 다시 확인합니다.';
  return;
 }
 if(available()){retryDelay=initialDelay;void connect();}
}
function retryNow(){
 activated=true;
 retryDelay=initialDelay;
 if(available())void connect(true);else resume();
}
window.addEventListener('online',resume);
window.addEventListener('offline',resume);
document.addEventListener('visibilitychange',resume);
document.getElementById('retry').onclick=retryNow;
resume();
</script></body></html>
